name: CI

on:
  push:
    branches: [main]
  pull_request:

# GITHUB_TOKEN の権限を必要な範囲に絞る。チェックアウトとテストしかしないので読み取りだけでよい。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: uvのセットアップ
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: 依存パッケージのインストール
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: フォーマットの確認
        run: uv run ruff format --check

      # slowマーカーのテストは実ダンプから切り出したフィクスチャを必要とするため、
      # CIでは実行しない（フィクスチャが無い場合は自動でスキップされる）。
      - name: テスト
        run: uv run pytest -m "not slow"
